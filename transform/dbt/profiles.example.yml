# Copy to profiles.yml in this folder (git-ignored), or into a folder named by
# DBT_PROFILES_DIR. No password goes here: libpq reads it on its own from
# %APPDATA%\postgresql\pgpass.conf because the password below is empty.
halifax_twin:
  target: local
  outputs:
    local:
      type: postgres
      host: localhost
      port: 5433
      user: postgres
      password: ""          # empty on purpose: libpq falls back to pgpass.conf
      dbname: halifax_twin
      # dbt only writes to this schema if a model or store_failures is added.
      # This project has no models, so nothing is ever created.
      schema: dbt_quality
      threads: 4
      connect_timeout: 10
