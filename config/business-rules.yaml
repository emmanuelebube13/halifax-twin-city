# Interim business rules for the Halifax Digital Twin.
# Status: not yet decided. The architect owns these values; change them here, never in code.
# Read by the serving API (services/api) and the collectors (services/collector).
status: not yet decided

on_time:
  # A bus is on time when it is between 60 s early and 300 s late (not yet decided).
  early_limit_seconds: -60
  late_limit_seconds: 300

frequent_service:
  # A route counts as frequent when a bus comes every 15 minutes or better,
  # weekdays 07:00 to 19:00 (not yet decided).
  max_headway_minutes: 15
  weekdays_from: "07:00"
  weekdays_to: "19:00"

walk:
  # A 5-minute walk is taken as 400 m in a straight line (not yet decided).
  five_minute_walk_metres: 400

stops:
  # Store both the HRM stop number and the GTFS stop_id; show the HRM number (not yet decided).
  display_number: hrm_stop_number

# Raw files under the data root are kept for a rolling 7 days, then deleted.
# bronze.feed_fetch rows are always kept. Decided 21 Nov 2026.
raw_retention_days: 7

live:
  # A live feed with no successful load for this long is marked stale.
  stale_after_seconds: 120
  # A bus counts as live when it reported a position within this window.
  vehicle_window_seconds: 180
  # On-time numbers look at stop arrivals within this window.
  arrival_window_minutes: 30
  # How often the web app should ask for live layers again.
  refresh_seconds: 15

display:
  time_zone: America/Halifax
  clock: 24-hour
  date_format: "21 Nov 2026"

transit_measures:
  # Thresholds passed to the gold transit functions (database/gold, workstream B). Not yet decided.
  # A bus is bunched when it arrives less than 0.25 x the scheduled gap behind the bus ahead.
  bunched_ratio: 0.25
  # A long gap is more than 1.5 x the scheduled gap.
  long_gap_ratio: 1.5
  # A segment day is slow when its median time is above 1.2 x the planned time.
  slow_ratio: 1.2
  # A trip can be called "not run" only if trip updates were fetched with no gap over 300 s.
  coverage_gap_seconds: 300
  # Days of archive the analytics numbers look back over.
  window_days: 7
  segment_window_days: 28
  # A segment is consistently slow when at least half its observed days are slow, over at least 5 days.
  consistently_slow_share: 0.5
  consistently_slow_min_days: 5

closures:
  # A closure affects a bus route when the closure line is within 20 m of the route line (not yet decided).
  route_buffer_metres: 20
  # A stop is beside a closure when it is within 30 m of the closure line (not yet decided).
  stop_buffer_metres: 30
  # How far ahead "planned closures" look.
  upcoming_days: 30
